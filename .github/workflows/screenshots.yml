# On-demand menu screenshots. Run from the Actions tab (or `gh workflow run
# screenshots.yml --ref <branch>`): captures the splash, menus, wizard and
# load screens with headless Chromium and commits the PNGs back to the same
# branch under ./screenshots/.
#
# Dispatch-only on purpose: the bot's own push must not re-trigger it (and
# GITHUB_TOKEN pushes never trigger workflows anyway).
name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install headless Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 5199 --strictPort &> preview.log &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5199/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5199/ > /dev/null

      - name: Capture screenshots
        run: node scripts/screenshots.mjs
        env:
          BASE_URL: http://127.0.0.1:5199

      - name: Commit PNGs back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet && echo "no screenshot changes" || git commit -m "chore: refresh menu screenshots [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
