# Verify the production bundle in a real mobile browser, then publish that exact
# bundle to GitHub Pages. Pull requests run the same gate but never upload or
# deploy a Pages artifact.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # mobile smoke + the two sim-boundary runs (worker, then in-process) all
    # share one build and one server; the headroom is for software GL on runners.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install and build once. The smoke test and deployed artifact now use the
      # same dist/ tree instead of separate jobs repeating npm ci + build.
      - run: npm ci

      - name: Install headless Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 5199 --strictPort &> preview.log &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5199/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5199/ > /dev/null

      - name: Run the mobile smoke test
        run: |
          set -o pipefail
          node scripts/mobile-smoke.mjs 2>&1 | tee smoke-output.txt
        env:
          BASE_URL: http://127.0.0.1:5199

      # The same assertions against the same build, once per transport: a
      # divergence between the in-process host and the worker fails here instead
      # of in someone's playthrough. The worker run is first because it is the one
      # with a silent fallback to catch (createHost degrades on purpose).
      - name: Run the sim-boundary smoke test (worker host)
        run: |
          set -o pipefail
          node scripts/worker-smoke.mjs 2>&1 | tee worker-smoke-output.txt
        env:
          BASE_URL: http://127.0.0.1:5199

      # `?worker=0`, not an empty query: the worker is the default transport now,
      # so an empty query would run the worker twice and quietly drop the
      # in-process gate. The smoke test asserts which transport the page
      # actually got, which is what makes that mistake fail here.
      - name: Run the sim-boundary smoke test (in-process host)
        run: |
          set -o pipefail
          SMOKE_QUERY='?worker=0' node scripts/worker-smoke.mjs 2>&1 | tee -a worker-smoke-output.txt
        env:
          BASE_URL: http://127.0.0.1:5199

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-output.txt
            worker-smoke-failure.png
            worker-smoke-output.txt
            preview.log
          if-no-files-found: ignore

      - name: Post failure output to the PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          [ -f smoke-output.txt ] || echo '(no output captured)' > smoke-output.txt
          {
            echo "Smoke gate failed on ${GITHUB_SHA::7}. Output:"
            echo '```'
            cat smoke-output.txt
            [ -f worker-smoke-output.txt ] && cat worker-smoke-output.txt
            echo '```'
          } > smoke-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file smoke-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue on main failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          [ -f smoke-output.txt ] || echo '(no output captured)' > smoke-output.txt
          { echo "The mobile smoke gate failed on \`main@${GITHUB_SHA::7}\` — deploy skipped."; echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo '```'; cat smoke-output.txt; echo '```'; } > smoke-issue.md
          gh issue create --title "Smoke gate failed on main@${GITHUB_SHA::7}" --body-file smoke-issue.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
